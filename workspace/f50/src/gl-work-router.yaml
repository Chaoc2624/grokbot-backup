# GL-MT3600BE OpenClash main profile (generated 2026-10-03, modeled on the user's Loon config)
# Nodes come from proxy-provider "omni" = /etc/openclash/config/omni-sub.yaml, which OpenClash's
# config subscription "omni-sub" (Config Subscribe page) refreshes every 12h. Do NOT select omni-sub.yaml as the active config.
mixed-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
geodata-mode: false
geo-auto-update: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
  - Mijia Cloud
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.19.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - rule-set:geosite-private
  - rule-set:geosite-cn
  - +.lan
  - +.local
  - +.arpa
  - localhost.ptr
  - console.gl-inet.com
  - +.3gppnetwork.org
  - gspe1-ssl.ls.apple.com
  - gs-loc.apple.com
  - gs-loc-cn.apple.com
  - +.qpic.cn
  - +.qlogo.cn
  - +.weixin.qq.com
  - +.wechat.com
  - +.servicewechat.com
  - +.wx.qq.com
  - +.tenpay.com
  - +.argotunnel.com
  - +.trycloudflare.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.pool.ntp.org
  - stun.*.*
  - stun.*.*.*
  - +.stun.*.*
  - +.stun.*.*.*
  use-hosts: true
  use-system-hosts: false
  respect-rules: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#默认出口
  - https://8.8.8.8/dns-query#默认出口
  proxy-server-nameserver: &id001
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver: *id001
  nameserver-policy:
    rule-set:geosite-cn,geosite-private: *id001
    +.tube-cat.com: *id001
    +.catcat321.com: *id001
    +.gcp300.com: *id001
    +.omnitools.cc: *id001
    +.0b96e976-9ec3-44c0-aa2b-30bf8b0792ea.com: *id001
    +.qpic.cn:
    - 119.29.29.29
    +.qlogo.cn:
    - 119.29.29.29
    +.weixin.qq.com:
    - 119.29.29.29
    +.weixin.com:
    - 119.29.29.29
    +.wechat.com:
    - 119.29.29.29
    +.wx.qq.com:
    - 119.29.29.29
    +.servicewechat.com:
    - 119.29.29.29
    +.douyin.com:
    - 119.29.29.29
    +.douyinpic.com:
    - 119.29.29.29
    +.amemv.com:
    - 119.29.29.29
    +.doubao.com:
    - 119.29.29.29
    +.snssdk.com:
    - 119.29.29.29
    +.toutiao.com:
    - 119.29.29.29
    +.byteimg.com:
    - 119.29.29.29
    +.bytedance.com:
    - 119.29.29.29
    +.bytedance.net:
    - 119.29.29.29
    +.ecombdapi.com:
    - 119.29.29.29
    +.ecombdimg.com:
    - 119.29.29.29
    +.jinritemai.com:
    - 119.29.29.29
    +.lan:
    - 127.0.0.1:53
    +.local:
    - 127.0.0.1:53
    +.arpa:
    - 127.0.0.1:53
    console.gl-inet.com:
    - 127.0.0.1:53
proxy-providers:
  omni:
    type: file
    path: ./config/omni-sub.yaml
    interval: 600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      expected-status: 204
  sakura:
    type: file
    path: ./proxy_provider/sakura.yaml
    exclude-filter: 剩余流量|套餐到期
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
