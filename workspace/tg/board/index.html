<!doctype html><html lang=zh><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">

.md{font-size:14px;line-height:1.6;color:#1f2328;margin-top:6px;word-break:break-word}.md p{margin:3px 0}.md ul,.md ol{margin:3px 0;padding-left:20px}.md li{margin:1px 0}
.md .mh{font-weight:700;margin:8px 0 2px;color:#111827}.md .mh:first-child{margin-top:2px}.md a{color:#1d6fe0;text-decoration:none;word-break:break-all}.md a:hover{text-decoration:underline}

details.tgg>summary::-webkit-details-marker{display:none}details.tgg>summary:before{content:'▸';color:#9ca3af;width:10px;flex-shrink:0;font-size:12px}details.tgg[open]>summary:before{content:'▾'}
.tgg .gn{font-weight:600;white-space:nowrap;flex-shrink:0}.tgg .gc{font-size:12px;color:var(--mut);white-space:nowrap;flex-shrink:0;min-width:42px}.tgg .gv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b7280;font-size:13px}
.tgg summary:hover .gn{color:#1d6fe0}.tgg.nil .gn{color:#9ca3af;font-weight:500}.tgg>.md{padding:0 0 8px 18px;margin-top:0}
.tgd .md.clamp{max-height:360px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent)}.more{font-size:13px;color:#1d6fe0;cursor:pointer;margin-top:4px;display:inline-block}
.pg{display:flex;gap:8px;justify-content:center;margin:6px 0 20px}.pg button{border:1px solid var(--b);background:#fff;border-radius:16px;padding:5px 14px;cursor:pointer;font-size:13px}

/* ---- TG chat-style digests ---- */
.br.tgw,.br.tgd{border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
details.tgg{border-top:1px solid #f0f1f3}details.tgg>summary{padding:8px 2px}

.cv mark.hl{background:#eaf2ff;color:#1a56c4;border-radius:4px;padding:0 2px;font-weight:500}
.cv .mt{font-size:11.5px;color:#9aa1ab;margin:3px 0 2px 11px}
.cv a{color:#1d6fe0;text-decoration:none;word-break:break-all}.cv a:hover{text-decoration:underline}
.cv .ga{font-size:11px;color:#6d28d9;background:#f3efff;border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap;font-weight:500}
.cv ul{margin:3px 0;padding-left:20px}.cv p{margin:3px 0}.cv code{background:#f3f4f6;border-radius:4px;padding:0 4px;font-size:13px}
.cv .vf{margin:12px 0 4px;background:#fbfaf6;border:1px dashed #e3d9b8;border-radius:10px;padding:8px 12px}

.cv .vi .vs{font-size:11.5px;color:#8a6d1f;background:#f5eed8;border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.cv .vi mark.hl{background:#f5eed8;color:#7a5a00}

 .tgg>.cv{margin-left:2px;padding-left:9px}.cv .vi .vs{white-space:normal}}

</style></head><body>
<header><div class=top><h1>📌 X 书签待办</h1><input id=q placeholder="搜索标题、需求、备注"><a href=logout style="font-size:13px;color:#6b7280">退出</a></div>
<nav id=nav></nav></header>
<main><div class=help id=help>流程：每次简报推送的新书签都会进到这里。没处理的「紧急」和「待处理」会在下一份简报里继续出现；普通事项被提醒 3 次仍没动会自动升为紧急。点「完成」或「忽略」就不再推，「不紧急」只留在这里不再推，「推迟」到期后重新开始推。<a href="#" onclick="this.parentNode.remove();localStorage.hideHelp=1">知道了</a></div><div id=list></div></main>
<div id=toast></div>
<script>
const V=[['urgent','🔴 紧急'],['open','📋 待处理'],['low','💤 不紧急'],['snoozed','⏸ 已推迟'],['done','✅ 已完成'],['ignored','🚫 已忽略'],['all','全部'],['briefs','📰 每日简报'],['radar','🔥 X 热词'],['tg','💬 TG 群总结']];
const NOI=k=>k=='briefs'||k=='radar'||k=='tg';
let FOCUS=null,view=location.hash.slice(1)||'urgent',T='',UN=localStorage.unread=='1';if(localStorage.hideHelp)document.getElementById('help').remove();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
async function load(){if(view.startsWith('item:')){FOCUS=view.slice(5);view='all'}const iv=NOI(view)?'all':view;const r=await fetch('api/items?view='+iv+'&unread='+(UN?1:0)+'&q='+encodeURIComponent(document.getElementById('q').value));if(r.status==401)return location.reload();const d=await r.json();T=d.today;{const h=document.getElementById('help');if(h)h.style.display=view=='tg'?'none':''}
document.getElementById('nav').innerHTML=V.map(([k,l])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${l}<span class=n>${NOI(k)?'':d.counts[k]}</span>${d.counts['unread_'+k]?`<span class=un>·${d.counts['unread_'+k]}新</span>`:''}</button>`).join('')+(NOI(view)?'':`<button class="uchip ${UN?'on':''}" onclick="UN=!UN;localStorage.unread=UN?1:0;load()">🆕 只看未读 ${d.counts['unread_'+view]}</button>`);{const o=document.querySelector('#nav .on');if(o)o.parentNode.scrollLeft=o.offsetLeft-o.parentNode.offsetLeft-40}if(view=='briefs')return briefs();if(view=='radar')return radar();if(view=='tg')return tg();
document.getElementById('list').innerHTML=d.items.length?d.items.map(card).join(''):`<div class=empty>${UN?'这里没有未读事项 👀':'这里没有事项 🎉'}</div>`;observe();if(FOCUS){const c=document.getElementById('c'+FOCUS);FOCUS=null;if(c){c.scrollIntoView({block:'center'});c.classList.add('flash')}}}
function go(k){view=k;location.hash=k;load()}
function fmt(p){const m=/(\d{4})-(\d\d)-(\d\d)[ T](\d\d:\d\d)/.exec(p||'');return m?m[2]+'-'+m[3]+' '+m[4]:p}
function card(i){const od=i.status=='open'&&i.due_date&&i.due_date<T;const sn=i.snooze_until&&i.snooze_until>T;const un=!i.read_at;
const P={urgent:'紧急',normal:'',low:'不紧急'}[i.priority],S={open:'',done:'已完成',ignored:'已忽略'}[i.status];
let a=[];if(i.status=='open'){a.push(`<button class=ok onclick="u('${i.id}',{status:'done'})">✅ 完成</button>`);
 if(i.priority!='urgent')a.push(`<button onclick="u('${i.id}',{priority:'urgent'})" title=设为紧急>🔴</button>`);
 if(i.priority=='urgent')a.push(`<button onclick="u('${i.id}',{priority:'normal'})" title=降为普通>⬇️ 普通</button>`);
 if(i.priority!='low')a.push(`<button onclick="u('${i.id}',{priority:'low'})" title=降为不紧急>💤</button>`);else a.push(`<button onclick="u('${i.id}',{priority:'normal'})" title=恢复普通>↩︎ 普通</button>`);
 a.push(sn?`<button onclick="u('${i.id}',{snooze_days:0})" title=取消推迟>▶️</button>`:`<button onclick="snz('${i.id}')" title=推迟>⏸</button>`);
 a.push(`<button class=no onclick="u('${i.id}',{status:'ignored'})" title=忽略>🚫</button>`)}
else a.push(`<button onclick="u('${i.id}',{status:'open'})" title=恢复待处理>↩︎ 恢复</button>`);
a.push(`<button class=no onclick="due('${i.id}','${i.due_date||''}')" title=截止日>📅</button>`,`<button class=no onclick="hist('${i.id}',this)" title=操作记录>🧾</button>`);
if(!un)a.push(`<button class=no onclick="u('${i.id}',{read:false})" title=标为未读>🆕</button>`);
return `<div class="card p-${i.priority} ${od?'overdue':''} ${un?'unread':''}" id="c${i.id}" data-id="${i.id}" data-un="${un?1:0}" onclick="tap(event,this)" onmouseenter="rd(this)"><div class=h>${un?'<span class=new>● 新</span>':''}${i.tag?`<span class=tag>${esc(i.tag)}</span>`:''}<div class=t>${esc(i.title)}</div>
${P?`<span class="badge ${i.priority=='urgent'?'red':''}">${P}</span>`:''}${S?`<span class=badge>${S}</span>`:''}${i.push_count>1?`<span class="badge red">已提醒 ${i.push_count} 次</span>`:''}${od?'<span class="badge red">已过期</span>':''}${sn?`<span class=badge>推迟到 ${i.snooze_until}</span>`:''}</div>
<span class=pt>🕒 ${i.posted_at?'发于 '+esc(fmt(i.posted_at)):'发帖时间未知'}<span class=sub> · 推送 ${esc(fmt(i.first_seen))}${i.last_pushed&&i.last_pushed!=i.first_seen?'（最近 '+esc(fmt(i.last_pushed))+'）':''}</span></span>${i.deadline?`<div class=dl>⏰ ${esc(i.deadline)}${i.due_date?'（截止 '+i.due_date+'）':''}</div>`:(i.due_date?`<div class=dl>⏰ 截止 ${i.due_date}</div>`:'')}

async function hist(id,btn){const r=await fetch('api/items/'+id+'/history');const d=await r.json();btn.closest('.card').querySelector('.hist').innerHTML=d.events.map(e=>esc(e.ts+'  '+e.what)).join('<br>')||'暂无记录'}
let qt;document.getElementById('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(load,250)};
window.onhashchange=()=>{view=location.hash.slice(1)||'urgent';load()};load();
</script></body></html>
