<header><div class=top><div class=brand><h1>Halo 的看板</h1><p class=brandsub>书签、群聊、新词和热词</p></div><input id=q placeholder="搜索标题、需求、备注" aria-label="搜索书签"><a class=logout href=logout>退出</a></div>
<div class=tabs id=tabs role=tablist></div>
<nav id=nav></nav></header>
<main><div class=help id=help>流程：每次简报推送的新书签都会进到这里。没处理的「紧急」和「待处理」会在下一份简报里继续出现；普通事项被提醒 3 次仍没动会自动升为紧急。点「完成」或「忽略」就不再推，「不紧急」只留在这里不再推，「推迟」到期后重新开始推。<a href="#" onclick="this.parentNode.remove();localStorage.hideHelp=1">知道了</a></div><div id=list></div></main>
<div id=toast></div>
<script>
const V=[['urgent','紧急'],['open','待处理'],['low','不紧急'],['snoozed','已推迟'],['done','已完成'],['ignored','已忽略'],['all','全部']];
const TABS=[['brief','每日简报'],['bm','X 书签'],['tg','TG 群聊记录'],['new','新词'],['hot','热词']];
const BM=new Set(V.map(x=>x[0]));
const NOI=k=>k=='brief'||k=='radar'||k=='tg'||k=='new'||k=='hot';
function sec(){const v=String(view).startsWith('item:')?'all':view;if(v=='brief')return 'brief';if(v=='tg')return 'tg';if(v=='hot')return 'hot';if(v=='new')return 'new';if(v=='radar')return RV=='kw'?'hot':'new';return 'bm'}
const HV=h=>{h=h||'brief';return h=='briefs'?'brief':h};
let FOCUS=null,view=HV(location.hash.slice(1)),T='',UN=localStorage.unread=='1';if(localStorage.hideHelp)document.getElementById('help').remove();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
async function load(){if(view.startsWith('item:')){FOCUS=view.slice(5);view='all'}const iv=NOI(view)?'all':view;const r=await fetch('api/items?view='+iv+'&unread='+(UN?1:0)+'&q='+encodeURIComponent(document.getElementById('q').value));if(r.status==401)return location.reload();const d=await r.json();T=d.today;{const h=document.getElementById('help');if(h)h.style.display=sec()=='bm'?'':'none'}
if(view=='new')RV='tl';else if(view=='hot')RV='kw';if(BM.has(view))localStorage.bmview=view;
const onTab=sec();
document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button type=button role=tab aria-selected="${onTab==k}" class="${onTab==k?'on':''}" onclick="goTab('${k}')">${l}</button>`).join('');
const showBm=onTab=='bm';
document.getElementById('q').hidden=!showBm;{const o=document.querySelector('#tabs .on');if(o)o.parentNode.scrollLeft=o.offsetLeft-o.parentNode.offsetLeft-40}
document.getElementById('nav').hidden=!showBm;
document.getElementById('nav').innerHTML=showBm?V.map(([k,l])=>`<button type=button class="${k==view?'on':''}" onclick="go('${k}')">${l}<span class=n>${NOI(k)?'':d.counts[k]}</span>${d.counts['unread_'+k]?`<span class=un>·${d.counts['unread_'+k]}新</span>`:''}</button>`).join('')+(NOI(view)?'':`<button type=button class="uchip ${UN?'on':''}" onclick="UN=!UN;localStorage.unread=UN?1:0;load()">只看未读 ${d.counts['unread_'+view]}</button>`):'';{const o=document.querySelector('#nav .on');if(o)o.parentNode.scrollLeft=o.offsetLeft-o.parentNode.offsetLeft-40}if(view=='brief')return briefs();if(view=='radar'||view=='new'||view=='hot')return radar();if(view=='tg')return tg();
document.getElementById('list').innerHTML=d.items.length?d.items.map(card).join(''):`<div class=empty>${UN?'这里没有未读事项 👀':'这里没有事项 🎉'}</div>`;observe();if(FOCUS){const c=document.getElementById('c'+FOCUS);FOCUS=null;if(c){c.scrollIntoView({block:'center'});c.classList.add('flash')}}}
function go(k){view=k;if(BM.has(k))localStorage.bmview=k;location.hash=k;load()}
function goTab(s){if(s=='brief')view='brief';else if(s=='bm'){if(!BM.has(view))view=localStorage.bmview||'urgent'}else if(s=='tg')view='tg';else if(s=='new'){view='new';RV='tl';localStorage.rv='tl'}else if(s=='hot'){view='hot';RV='kw';localStorage.rv='kw'}location.hash=view;load()}
function fmt(p){const m=/(\d{4})-(\d\d)-(\d\d)[ T](\d\d:\d\d)/.exec(p||'');return m?m[2]+'-'+m[3]+' '+m[4]:p}
function card(i){const od=i.status=='open'&&i.due_date&&i.due_date<T;const sn=i.snooze_until&&i.snooze_until>T;const un=!i.read_at;
const P={urgent:'紧急',normal:'普通',low:'不紧急'}[i.priority],S={open:'',done:'已完成',ignored:'已忽略'}[i.status];
let a=[];if(i.status=='open'){a.push(`<button class=ok onclick="u('${i.id}',{status:'done'})" title=标记完成>✅ 完成</button>`);
 if(i.priority!='urgent')a.push(`<button onclick="u('${i.id}',{priority:'urgent'})" title=设为紧急>🔴 紧急</button>`);
 if(i.priority=='urgent')a.push(`<button onclick="u('${i.id}',{priority:'normal'})" title=降为普通>⬇️ 普通</button>`);
 if(i.priority!='low')a.push(`<button onclick="u('${i.id}',{priority:'low'})" title=降为不紧急>💤 不紧急</button>`);else a.push(`<button onclick="u('${i.id}',{priority:'normal'})" title=恢复普通>↩︎ 普通</button>`);
 a.push(sn?`<button onclick="u('${i.id}',{snooze_days:0})" title=取消推迟>▶️ 取消推迟</button>`:`<button onclick="snz('${i.id}')" title=推迟>⏸ 推迟</button>`);
 a.push(`<button class=no onclick="u('${i.id}',{status:'ignored'})" title=忽略>🚫 忽略</button>`)}
else a.push(`<button onclick="u('${i.id}',{status:'open'})" title=恢复待处理>↩︎ 恢复</button>`);
a.push(`<button class=no onclick="due('${i.id}','${i.due_date||''}')" title=截止日>📅 截止日</button>`,`<button class=no onclick="hist('${i.id}',this)" title=操作记录>🧾 记录</button>`);
if(!un)a.push(`<button class=no onclick="u('${i.id}',{read:false})" title=标为未读>🆕 未读</button>`);
return `<div class="card p-${i.priority} ${od?'overdue':''} ${un?'unread':''}" id="c${i.id}" data-id="${i.id}" data-un="${un?1:0}" onclick="tap(event,this)" onmouseenter="rd(this)"><div class=h>${un?'<span class=new>● 新</span>':''}${i.tag?`<span class=tag>${esc(i.tag)}</span>`:''}<div class=t>${esc(i.title)}</div>
${P?`<span class="prio ${i.priority}">${P}</span>`:''}${S?`<span class=badge>${S}</span>`:''}${i.push_count>1?`<span class="badge red">已提醒 ${i.push_count} 次</span>`:''}${od?'<span class="badge red">已过期</span>':''}${sn?`<span class=badge>推迟到 ${i.snooze_until}</span>`:''}</div>
<span class=pt>🕒 ${i.posted_at?'发于 '+esc(fmt(i.posted_at)):'发帖时间未知'}<span class=sub> · 推送 ${esc(fmt(i.first_seen))}${i.last_pushed&&i.last_pushed!=i.first_seen?'（最近 '+esc(fmt(i.last_pushed))+'）':''}</span></span>${i.deadline?`<div class=dl>⏰ ${esc(i.deadline)}${i.due_date?'（截止 '+i.due_date+'）':''}</div>`:(i.due_date?`<div class=dl>⏰ 截止 ${i.due_date}</div>`:'')}
${i.need?`<div class=row><span class=k>需求：</span>${esc(i.need)}</div>`:''}${i.action?`<div class=row><span class=k>建议：</span>${esc(i.action)}</div>`:''}
<div class=foot>${i.url?`<a class=tweet href="${esc(i.url)}" target=_blank rel=noopener onclick="rd(this.closest('.card'))">打开原帖 ↗</a>`:''}<div class=acts>${a.join('')}</div>${i.note?'':`<span class=tg onclick="const t=this.closest('.card').querySelector('textarea');t.style.display='block';t.focus();this.style.visibility='hidden'">✏️ 加备注</span>`}</div>
<textarea style="${i.note?'':'display:none'}" placeholder="备注（失焦自动保存）" onchange="u('${i.id}',{note:this.value},1)">${esc(i.note)}</textarea><div class=hist></div></div>`}
function tap(e,el){if(e.target.closest('button,a,textarea,input,.tg'))return;el.classList.toggle('open');rd(el)}
function rd(el){if(!el||el.dataset.un!='1')return;el.dataset.un='0';el.classList.remove('unread');el.querySelector('.new')?.remove();
fetch('api/items/'+el.dataset.id,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'xbm'},body:JSON.stringify({read:true})})}
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{const el=e.target;if(e.isIntersecting&&e.intersectionRatio>=.6){el._t=setTimeout(()=>{rd(el);io.unobserve(el)},1500)}else clearTimeout(el._t)}),{threshold:[0,.6]});
document.querySelectorAll('.card[data-un="1"]').forEach(c=>io.observe(c))}

const STL={open:'待处理',done:'已完成',ignored:'已忽略'};
function bitem(i){const st=i.status=='open'?(i.priority=='urgent'?['urgent','紧急']:i.priority=='low'?['low','不紧急']:['open','待处理']):[i.status,STL[i.status]];
return `<div class=bi>${i.tag?`<span class=tag>${esc(i.tag)}</span>`:''}<a class=tt href="#item:${i.id}" title="${esc(i.title)}">${esc(i.title)}</a>${i.posted_at?`<span class=pa>🕒 ${esc(fmt(i.posted_at))}</span>`:''}<span class="st ${st[0]}">${st[1]}</span>${i.url?`<a class=ox href="${esc(i.url)}" target=_blank rel=noopener>原帖 ↗</a>`:''}</div>`}
async function briefs(){const r=await fetch('api/briefs');const d=await r.json();let day='',h='<div class=tl>';
let bi0=0;for(const b of d.briefs){const first=bi0++==0;const dd=(b.label.match(/\d{4}-\d\d-\d\d/)||[b.run_at.slice(0,10)])[0];if(dd!=day){day=dd;h+=`<div class=day>${dd}</div>`}
const noon=/上午|中午/.test(b.label);
h+=`<div class="br ${noon?'noon':''}${first?' latest':''}"><div class=bh><b>${noon?'☀️':'🌙'} ${esc(b.label)}</b>${first?'<span class="pill">最新</span>':''}<span class=bt>${esc(b.run_at)} 推送 · 新增 ${b.new.length} · 提醒 ${b.carried.length}</span>${b.has_pdf?`<a class=pdf href="api/briefs/${b.id}/pdf" target=_blank>📄 PDF</a>`:''}</div>
${b.summary?`<div class=sum>${esc(b.summary)}</div>`:''}${b.new.length?`<div class=sec>本次新增</div>${b.new.map(bitem).join('')}`:'<div class=sec>本次没有新增</div>'}
${b.carried.length?`<details${first?' open':''}><summary>继续提醒的未处理事项 ${b.carried.length} 条</summary>${b.carried.map(bitem).join('')}</details>`:''}</div>`}
document.getElementById('list').innerHTML=d.briefs.length?h+'</div>':'<div class=empty>还没有简报记录</div>'}

let RD=null,RR=localStorage.rr||'3',RV=localStorage.rv||'tl',RS=localStorage.rs||'new';
const dadd=(d,n)=>{const x=new Date(d+'T12:00:00+08:00');x.setDate(x.getDate()+n);return new Date(x.getTime()+8*3600e3).toISOString().slice(0,10)};
function rset(k,v){if(k=='rr'){RR=v;localStorage.rr=v}if(k=='rv'){RV=v;localStorage.rv=v}if(k=='rs'){RS=v;localStorage.rs=v}if(k=='rd')RD=v;radar()}
async function radar(){let qs='';if(!RD)RD=T;if(RR!='all'){const n=+RR;qs='?from='+dadd(RD,1-n)+'&to='+RD}
const r=await fetch('api/radar'+qs);const d=await r.json();const runs=d.runs;
const rng=RR=='all'?'全部时间':(RR=='1'?RD:dadd(RD,1-RR)+' ~ '+RD);
let h=`<div class=rbar><button onclick="rset('rd','${dadd(RD,-1)}')">‹ 前一天</button><input type=date value="${RD}" max="${d.today}" onchange="rset('rd',this.value||'${d.today}')"><button onclick="rset('rd','${dadd(RD,1)}')" ${RD>=d.today?'disabled style="opacity:.4"':''}>后一天 ›</button>${RD!=d.today?`<button onclick="rset('rd','${d.today}')">回到今天</button>`:''}<span class=sp></span>
${[['1','今天'],['3','3天'],['7','7天'],['all','全部']].map(([k,l])=>`<button class="${RR==k?'on':''}" onclick="rset('rr','${k}')">${k=='1'&&RD!=d.today?'当天':l}</button>`).join('')}</div>
<div class=rbar><span class=bt>${esc(rng)} · ${runs.length} 次扫描 · ${runs.reduce((a,x)=>a+x.items.length,0)} 个发布</span></div>`;
if(RV=='kw')h+=kwBoard(runs);else h+=rTimeline(runs);
document.getElementById('list').innerHTML=h}
function kwBoard(runs){const M={};for(const r of runs.slice().reverse())for(const k of r.keywords){const key=k.keyword.trim().toLowerCase();if(!key)continue;
 const m=M[key]||(M[key]={kw:k.keyword,n:0,first:r,last:r,reason:'',prods:new Set()});m.n++;m.last=r;if(k.reason)m.reason=k.reason;
 const toks=key.split(/[\s\-_/]+/).filter(t=>t.length>1);const rel=r.items.filter(i=>toks.some(t=>(i.name+' '+i.desc).toLowerCase().includes(t)));(rel.length?rel:r.items.slice(0,2)).forEach(i=>m.prods.add(i.name))}
let L=Object.values(M);L.sort(RS=='cnt'?(a,b)=>b.n-a.n||(b.last.run_at>a.last.run_at?1:-1):(a,b)=>(b.last.run_at>a.last.run_at?1:b.last.run_at<a.last.run_at?-1:b.n-a.n));
if(!L.length)return '<div class=rbox><div class=emp>这段时间还没有热词。</div></div>';
return `<div class=rbox><h3>热词榜 <span class=bt>排序</span>${[['new','最新'],['cnt','次数']].map(([k,l])=>`<a href="#hot" onclick="rset('rs','${k}');return false" style="font-size:13px;font-weight:${RS==k?650:400};color:${RS==k?'#1a56c4':'#6b7280'};text-decoration:none">${l}</a>`).join(' ')}</h3>
<div class=tw><table class=rt><tr><th>#</th><th>关键词</th><th>次数</th><th>最新理由</th><th>首次 / 最近</th><th>相关产品</th></tr>
${L.map((m,i)=>`<tr><td class=rk>${i+1}</td><td class=kw>${esc(m.kw)}</td><td><span class=cnt>${m.n}</span></td><td>${esc(m.reason)}</td><td class="nw mut">${esc(m.first.label)}${m.first!==m.last?'<br>'+esc(m.last.label):''}</td><td class=rp>${[...m.prods].slice(0,4).map(esc).join('、')}</td></tr>`).join('')}</table></div></div>`}
const kn=s=>(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
const ktoks=s=>(s||'').toLowerCase().split(/[\s\p{P}\p{S}]+/u).filter(t=>t.length>1);
function fsKey(v,day){v=v||'';if(/^\d{4}-/.test(v))return v;if(/^\d\d-\d\d/.test(v))return (day||'').slice(0,4)+'-'+v;return ''}
function kwMatch(k,i){const a=kn(k),b=kn(i.name);if(!a||!b)return 0;if(a==b)return 100;if(b.includes(a)||a.includes(b))return 90;
 const ts=ktoks(k);if(!ts.length)return 0;const nm=(i.name||'').toLowerCase(),all=nm+' '+(i.desc||'').toLowerCase();
 if(!ts.every(t=>all.includes(t)))return 0;const inN=ts.filter(t=>nm.includes(t)).length;return inN*2>=ts.length?10+inN:0}
function rRows(r){const items=r.items.map(i=>({...i})),kws=(r.keywords||[]).slice().sort((a,b)=>(a.rank||99)-(b.rank||99));
 const rk=k=>{const x=kws.find(z=>kn(z.keyword)==kn(k));return x?x:null};
 for(const i of items)if(i.keyword||i.keyword_rank!=null){i.kw=i.keyword||i.name;const x=rk(i.kw);i.rank=i.keyword_rank??(x?x.rank:99);i.reason=i.reason||(x?x.reason:'')}
 const extra=[];for(const k of kws){if(items.some(i=>i.kw&&kn(i.kw)==kn(k.keyword)))continue;
  let best=null,bs=0;for(const i of items){if(i.kw)continue;const s=kwMatch(k.keyword,i);if(s>bs){bs=s;best=i}}
  if(best){best.kw=k.keyword;best.rank=k.rank||99;best.reason=k.reason||''}else extra.push({name:k.keyword,kw:k.keyword,rank:k.rank||99,reason:k.reason||'',only:1})}
 const top=items.filter(i=>i.kw).concat(extra).sort((a,b)=>a.rank-b.rank);
 const rest=items.filter(i=>!i.kw).sort((a,b)=>fsKey(b.first_seen,r.day)<fsKey(a.first_seen,r.day)?-1:fsKey(b.first_seen,r.day)>fsKey(a.first_seen,r.day)?1:0);
 return top.concat(rest)}
function rTimeline(runs){if(!runs.length)return '<div class=rbox><div class=emp>这段时间没有扫描记录。</div></div>';let day='',h='<div class=tl>';
for(const r of runs){if(r.day!=day){day=r.day;h+=`<div class=day>${day}</div>`}const noon=/上午|中午/.test(r.label)||(r.run_at||'').slice(11,13)=='12';
const win=r.window_start?`${fmt(r.window_start)} ~ ${fmt(r.window_end||r.run_at)}`:'';
if(r.empty&&!r.items.length){h+=`<div class="br ${noon?'noon':''}" style="padding:8px 14px"><div class=bh><b style="font-size:14px">${noon?'☀️':'🌙'} ${esc(r.label)}</b><span class=bt>${win} · 今天当前无重要发布${r.note?' · '+esc(r.note):''}</span></div></div>`;continue}
h+=`<div class="br ${noon?'noon':''}"><div class=bh><b>${noon?'☀️':'🌙'} ${esc(r.label)}</b><span class=bt>${win?'窗口 '+win+' · ':''}${r.items.length} 个发布</span></div>${r.note?`<div class=sum>${esc(r.note)}</div>`:''}
<div class=tw style="margin-top:8px"><table class=rt><tr><th>产品</th><th>是干什么的</th><th>来源</th><th>首发时间</th><th>链接</th></tr>
${rRows(r).map(i=>`<tr class="${i.kw?'kwr':''}"><td class=nm>${esc(i.name)}${i.kw?`<span class=kwc title="${esc('建站词 #'+i.rank+(i.kw!==i.name?'：'+i.kw:''))}">🔑 建站词</span>`:''}</td><td>${i.only?`<span class=sug>建议：${esc(i.reason)}</span>`:esc(i.desc)}${i.kw&&!i.only&&i.reason?`<div class=sug>建议：${esc(i.reason)}</div>`:''}</td><td class=nw>${esc(i.source||'')}</td><td class="nw mut">${esc(fmt(i.first_seen)||'')}</td><td class=nw>${i.url?`<a class=ox href="${esc(i.url)}" target=_blank rel=noopener style="color:#1d9bf0;font-weight:600;text-decoration:none">原帖 ↗</a>`:''}</td></tr>`).join('')}</table></div></div>`}
return h+'</div>'}
// ---------- 💬 TG 群总结 ----------
let GD=null,GR=localStorage.gr||'1',GP=0,GX={};
function gset(k,v){if(k=='gr'){GR=v;localStorage.gr=v;GP=0}if(k=='gd'){GD=v;GP=0}if(k=='gp')GP=v;tg()}
function inl(t){const L=[];t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>{L.push(`<a href="${u}" target=_blank rel=noopener>${a}</a>`);return '\u0000'+(L.length-1)+'\u0000'});
t=t.replace(/https?:\/\/[^\s<>()（）"'，。、]+/g,u=>{L.push(`<a href="${u}" target=_blank rel=noopener>${u.replace(/^https?:\/\//,'').slice(0,48)}${u.length>56?'…':''}</a>`);return '\u0000'+(L.length-1)+'\u0000'});
t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/【([^】]{1,24})】/g,'<span class=ga>$1</span>');
return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>L[+i])}
function md(src){const out=[];let lt=null;const close=()=>{if(lt){out.push(`</${lt}>`);lt=null}};
for(let ln of esc(src||'').split('\n')){const t=ln.trim();if(!t){close();continue}let m;
 if(m=/^#{1,4}\s+(.*)/.exec(t)){close();out.push(`<div class=mh>${inl(m[1])}</div>`)}
 else if(m=/^[-*•]\s+(.*)/.exec(t)){if(lt!='ul'){close();out.push('<ul>');lt='ul'}out.push(`<li>${inl(m[1])}</li>`)}
 else if(m=/^\d+[.)、]\s*(.*)/.exec(t)){if(lt!='ol'){close();out.push('<ol>');lt='ol'}out.push(`<li>${inl(m[1])}</li>`)}
 else{close();out.push(`<p>${inl(t)}</p>`)}}close();return out.join('')}
function hli(t){const L=[];const ph=h=>{L.push(h);return '\u0000'+(L.length-1)+'\u0000'};
 t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>ph(`<a href="${u}" target=_blank rel=noopener>${a}</a>`));
 t=t.replace(/https?:\/\/[^\s<>()（）"'，。、]+/g,u=>ph(`<a href="${u}" target=_blank rel=noopener>${u.replace(/^https?:\/\//,'').slice(0,48)}${u.length>56?'…':''}</a>`));
 t=t.replace(/==([^=\n]{1,40}?)==/g,'<mark class=hl>$1</mark>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/【([^】]{1,24})】/g,'<span class=ga>$1</span>');
 return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>L[+i])}
const TOKRE=/\s*\{\{([^{}\n]{4,40})\}\}\s*$/;
function tok(s){const m=TOKRE.exec(s);if(!m)return {txt:s,hms:'',full:''};const txt=s.slice(0,m.index);
 const r=/^(?:(\d{4}-\d\d-\d\d)[ T])?(\d{1,2}:\d\d(?::\d\d)?)(?:\s*[~–-]\s*(?:\d{4}-\d\d-\d\d[ T])?(\d{1,2}:\d\d(?::\d\d)?))?$/.exec(m[1].trim());
 if(!r)return {txt,hms:'',full:''};const d=r[1]||CHD||'';return {txt,hms:r[2],full:(d?d+' ':'')+r[2]+(r[3]&&r[3]!=r[2]?' – '+r[3]:'')}}
const untok=c=>(c||'').split('\n').map(l=>l.replace(TOKRE,'')).join('\n');
let CHD='';
const VFH='#### 🔎 网上核验（外部公开来源，不是群友发言）';
const isVH=t=>/^#{1,4}\s+.*网上核验/.test(t),isBound=t=>/^#{1,4}\s/.test(t)||/^\*\*\d{1,2}:\d{2}\s*[–-]\s*\d{1,2}:\d{2}\*\*$/.test(t);
function tkey(l){const m=TOKRE.exec(l);if(!m)return '';const r=/^(?:(\d{4}-\d\d-\d\d)[ T])?(\d{1,2}:\d\d(?::\d\d)?)/.exec(m[1].trim());if(!r)return '';let t=r[2];if(t.split(':').length==2)t+=':00';return (r[1]||'0000-00-00')+' '+t.padStart(8,'0')}
function vkey(l){const m=/^[-*•]\s*[（(](\d{1,2}):(\d{2})/.exec(l);return m?m[1].padStart(2,'0')+':'+m[2]:''}
function sortDesc(arr,key){const t=arr.filter(x=>key(x)),u=arr.filter(x=>!key(x));t.sort((a,b)=>key(b)<key(a)?-1:key(b)>key(a)?1:0);return t.concat(u)}
// reorder one content: speech rows newest-first inside each topic segment; pull 网上核验 entries out
function reord(c){const L=(c||'').split('\n'),body=[],ver=[];let inv=false,seg=[];
 const flush=()=>{const idx=seg.map((l,i)=>/^>\s*[^：:\n]{1,40}[：:]/.test(l.trim())?i:-1).filter(i=>i>=0);const sp=sortDesc(idx.map(i=>seg[i]),tkey);idx.forEach((i,k)=>seg[i]=sp[k]);body.push(...seg);seg=[]};
 for(const l of L){const t=l.trim();
  if(isVH(t)){flush();inv=true;continue}
  if(inv){if(isBound(t)){inv=false}else{if(/^[-*•]\s+/.test(t))ver.push(t);else if(t)ver.push('- '+t);continue}}
  if(isBound(t))flush();seg.push(l)}
 flush();while(body.length&&!body[body.length-1].trim())body.pop();return {body:body.join('\n'),ver}}
const gtag=s=>(s||'').replace(/[【】\[\]]/g,'').slice(0,20);
function vsrc(ents){return ents.length?VFH+'\n'+sortDesc(ents,vkey).join('\n')+'\n\n':''}
function chat(src){const out=[];let lt=null,vf=false,cv=false;const close=()=>{if(lt){out.push(`</${lt}>`);lt=null}};
 const endv=()=>{if(vf){out.push('</div>');vf=false}};
 for(let ln of esc(src||'').split('\n')){const t=ln.trim();if(!t){close();continue}let m;
  if(m=/^\*\*(\d{1,2}:\d{2}\s*[–-]\s*\d{1,2}:\d{2})\*\*$/.exec(t)){close();endv();out.push(`<div class=hr><span>${m[1]}</span></div>`)}
  else if(m=/^#{1,4}\s+.*网上核验(.*)$/.exec(t)){close();endv();out.push(`<div class=vf><div class=vh>🔎 网上核验<span>外部公开来源，不是群友发言</span></div>`);vf=true}
  else if(m=/^###\s+(.*?)\s*(?:[（(]\s*(\d+)\s*条\s*\/\s*(\d+)\s*人\s*[)）])?\s*$/.exec(t)){close();endv();const z=/^零星消息/.test(m[1]);
   out.push(`<div class="tp${z?' z':''}"><span class=tt>${hli(m[1])}</span>${m[2]?`<span class=tm>${m[2]} 条 · ${m[3]} 人</span>`:''}</div>`)}
  else if(m=/^#{1,2}\s+(.*)/.exec(t)){close();endv();out.push(`<div class=sh>${hli(m[1])}</div>`)}
  else if(m=/^&gt;\s*([^：\n]{1,40})：\s*(.*)$/.exec(t)){close();const nm=m[1].trim();const tk=tok(m[2]);
   out.push(`<div class=sp><span class=nm><bdi>${nm}</bdi></span><span class=nf>${nm}</span><span class=tx>${hli(tk.txt).replace(/ · /g,'<i class=sep>·</i>')}</span><span class=st${tk.full?` title="${tk.full}"`:''}>${tk.hms}</span></div>`)}
  else if(m=/^~\s+(.*)/.exec(t)){close();out.push(`<div class=mt>${hli(m[1])}</div>`)}
  else if(vf&&(m=/^[-*•]\s+(.*)/.exec(t))){let r=m[1],tm='';const a=/^[（(](\d{1,2}:\d{2})[–-]\d{1,2}:\d{2}[)）]\s*/.exec(r);if(a){tm=a[1];r=r.slice(a[0].length)}
   const b=/^([^｜：]{1,40})｜([^：]{1,60})：\s*(.*)$/.exec(r);
   out.push(`<div class=vi>${tm?`<span class=vt>${tm}</span>`:''}${b?`<b>${hli(b[1])}</b><span class=vs>${hli(b[2])}</span><div>${hli(b[3])}</div>`:hli(r)}</div>`)}
  else if(m=/^[-*•]\s+(.*)/.exec(t)){if(lt!='ul'){close();out.push('<ul>');lt='ul'}out.push(`<li>${hli(m[1])}</li>`)}
  else{close();out.push(`<p>${hli(t)}</p>`)}}
 close();endv();return out.join('')}
function prev(c){c=untok(c);const tps=[];for(const l of c.split('\n')){const m=/^###\s+(.*?)\s*(?:[（(]\s*\d+\s*条.*)?$/.exec(l.trim());if(m&&!/^零星消息/.test(m[1])&&!tps.includes(m[1]))tps.push(m[1])}
 const cl=s=>s.replace(/==/g,'').replace(/\*\*/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/https?:\/\/\S+/g,'').replace(/`/g,'').replace(/【[^】]*】/g,'').trim();
 if(tps.length)return cl(tps.join(' · '));
 for(const l of c.split('\n')){const s=l.trim();if(/^\*\*\d{1,2}:\d{2}\s*[–-]\s*\d{1,2}:\d{2}\*\*$/.test(s)||/^#{1,4}\s+.*网上核验/.test(s)||/^~\s/.test(s))continue;const t=cl(s.replace(/^>\s*/,'').replace(/^[#\-*•\d.)、\s]+/,''));if(t)return t}return ''}
const NIL=c=>!c||/^\s*无重要内容\s*$/.test(c);
function cp(id){const t=untok(GX[id]);if(!t)return;navigator.clipboard.writeText(t).then(()=>toast('已复制 Markdown'),()=>toast('复制失败'))}
function exp(btn,on){btn.closest('.br').querySelectorAll('details.tgg').forEach(d=>d.open=on)}
async function tg(){if(!GD)GD=T;let qs='?per=0';if(GR=='all')qs='?per=5&page='+GP;else{const n=+GR;qs+='&from='+dadd(GD,1-n)+'&to='+GD}
const r=await fetch('api/tg'+qs);if(r.status==401)return location.reload();const d=await r.json();GX={};let gid=0;
const rng=GR=='all'?'全部时间':(GR=='1'?GD:dadd(GD,1-GR)+' ~ '+GD);
let h=`<div class=rbar><button onclick="gset('gd','${dadd(GD,-1)}')">‹ 前一天</button><input type=date value="${GD}" max="${d.today}" onchange="gset('gd',this.value||'${d.today}')"><button onclick="gset('gd','${dadd(GD,1)}')" ${GD>=d.today?'disabled style="opacity:.4"':''}>后一天 ›</button>${GD!=d.today?`<button onclick="gset('gd','${d.today}')">回到今天</button>`:''}<span class=sp></span>
${[['1','今天'],['3','3天'],['7','7天'],['all','全部']].map(([k,l])=>`<button class="${GR==k?'on':''}" onclick="gset('gr','${k}')">${k=='1'&&GD!=d.today?'当天':l}</button>`).join('')}</div>`;
const nw=d.days.reduce((a,x)=>a+x.windows.length,0),nm=d.days.reduce((a,x)=>a+x.windows.reduce((b,w)=>b+w.msg_count,0),0);
h+=`<div class=rbar><span class=bt>${esc(rng)} · ${GR=='all'?d.total_days:d.days.length} 天 · ${nw} 个时段 · ${nm} 条消息</span></div>`;
if(!d.days.length){document.getElementById('list').innerHTML=h+'<div class=rbox><div class=emp>这段时间还没有群总结。</div></div>';return}
h+='<div class=tl>';
for(const day of d.days){CHD=day.date;h+=`<div class=day>${day.date}</div>`;
 if(day.daily){const id='g'+(gid++);const ro=reord(day.daily.content);const dsrc=vsrc(ro.ver)+ro.body;GX[id]=dsrc;const up=(day.daily.updated_at||'').slice(11);const part=day.daily.partial;
  h+=`<div class="br tgd"><div class=hov><button onclick="cp('${id}')" title="复制 Markdown">复制</button></div><div class=bh><b>📅 全天合并总结</b>${part?`<span class="pill pp">截至 ${esc(up)}</span>`:''}<span class=bt>${esc(day.daily.msg_count!=null?day.daily.msg_count+' 条消息 · ':'')}更新 ${esc(up)}</span></div>
  <div class="cv${(day.daily.content||'').length>1200?' clamp':''}" id="${id}">${chat(dsrc)}</div>${(day.daily.content||'').length>1200?`<span class=more onclick="const m=document.getElementById('${id}');m.classList.toggle('clamp');this.textContent=m.classList.contains('clamp')?'展开全文 ▾':'收起 ▴'">展开全文 ▾</span>`:''}</div>`}
 for(const w of day.windows){const [a,b]=w.window.split('-');const id='g'+(gid++);
  const ra=w.all?reord(w.all.content):null,rg=w.groups.map(g=>reord(g.content));
  const ents=(ra?ra.ver:[]).concat(...rg.map((r,k)=>r.ver.map(v=>v+' 【'+gtag(w.groups[k].title)+'】')));const vs=vsrc(ents);
  GX[id]=vs+(ra?ra.body+'\n\n':'')+w.groups.map((g,k)=>`## ${g.title}（${g.msg_count??0} 条）\n${rg[k].body}`).join('\n\n');
  const hasAll=ra&&!NIL(ra.body);
  h+=`<div class="br tgw${w.partial?' part':''}"><div class=hov><button onclick="exp(this,true)" title="展开全部群">展开</button><button onclick="exp(this,false)" title="收起全部群">收起</button><button onclick="cp('${id}')" title="复制 Markdown">复制</button></div>
  <div class=bh><b>🕒 ${a}:00–${b}:00</b>${w.partial?`<span class="pill pp">进行中 · 至 ${esc((w.win_end||'').slice(11)||'现在')}</span>`:''}<span class=bt>${w.msg_count} 条 · ${w.groups.length} 群</span></div>
  ${vs?`<div class="cv vtop">${chat(vs)}</div>`:''}${hasAll?`<div class=cv>${chat(ra.body)}</div>`:''}
  ${w.groups.map((g,k)=>{const nil=NIL(rg[k].body);return `<details class="tgg${nil?' nil':''}"><summary><span class=gn>${esc(g.title)}</span><span class=gc>${g.msg_count??0} 条</span><span class=gv>${nil?'无重要内容':esc(prev(rg[k].body))}</span></summary>${nil?'':`<div class=cv>${chat(rg[k].body)}</div>`}</details>`}).join('')}</div>`}}
h+='</div>';
if(GR=='all'&&d.total_days>d.per){const pages=Math.ceil(d.total_days/d.per);h+=`<div class=pg>${GP>0?`<button onclick="gset('gp',${GP-1})">‹ 更新</button>`:''}<span class=bt style="align-self:center">第 ${GP+1} / ${pages} 页</span>${GP<pages-1?`<button onclick="gset('gp',${GP+1})">更早 ›</button>`:''}</div>`}
document.getElementById('list').innerHTML=h}
async function u(id,b,quiet){const r=await fetch('api/items/'+id,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'xbm'},body:JSON.stringify(b)});
if(!r.ok)return toast('保存失败');toast('已保存');if(!quiet)load()}
