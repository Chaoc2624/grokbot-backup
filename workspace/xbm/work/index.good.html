function pmSet(k,v){PM={k,v:k=='q'?(v||PM.v||'h6'):null}; document.querySelectorAll('#ppm .chips button').forEach(b=>b.classList.toggle('on',k=='q'&&b.dataset.q==PM.v));
 ['prq','prc','prr'].forEach((id,i)=>document.getElementById(id)?.classList.toggle('on','qcr'[i]==k));pfoot()}
function pmBody(){if(PM.k=='q')return Object.assign({},PQ.find(x=>x[0]==PM.v)[2]);
 if(PM.k=='c'){const n=+document.getElementById('pcn').value,u=document.getElementById('pcu').value;localStorage.pcn=n;localStorage.pcu=u;if(!(n>0))return null;if(u=='days'&&n>31||u=='hours'&&n>744)return null;return {[u]:n}}
 const f=document.getElementById('prf').value,t=document.getElementById('prt').value;if(!f||!t||f>=t)return null;return {from:f,to:t}}
function pmText(){const b=pmBody();if(!b)return '时间范围不对';if(b.hours)return `最近 ${b.hours} 小时`;if(b.days)return `最近 ${b.days} 天`;return `${b.from.replace('T',' ')} 至 ${b.to.replace('T',' ')}`}
function pfoot(){const f=document.getElementById('ppf');if(!f)return;const j=PJ;
 if(sumRun(j)){f.innerHTML=`<div class="stp ok">① ✅ 拉取完成：拉到 <b>${nf(j.fetched)}</b> 条，新增 <b>${nf(j.added)}</b> 条</div><div class="pgb done"><div class=pgf style="width:100%"></div></div>
  <div class="stp run"><span class=spn style="display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spn .8s linear infinite;margin-right:6px;vertical-align:-1px"></span>② 📝 AI 总结生成中…</div><div class="pgb ind"><div class=pgf></div></div>
  <div class=pgr>通常 1–3 分钟。可以关掉弹窗，顶部按钮会一直显示「总结中…」，总结好后时间轴自动刷新并跳到这次拉取。</div>
  <div class=acts2 style="margin-top:10px"><span class=sum2>${esc((j.since_bj||'')+' 至 '+(j.until_bj||''))}</span><button class="bt2 pri" onclick="pullClose()">后台等待</button></div>`;return}
 if(j&&j.status=='running'){f.innerHTML=`<div class=pgt><b>${Math.floor(j.percent||0)}%</b> · 第 ${j.current_index||0}/${j.groups_total} 个群 · ${esc(j.current_group||'准备中')} · 已拉 <b>${nf(j.fetched)}</b> 条（本群 ${nf(j.current_fetched)}）· 新增 ${nf(j.added)}</div>
  <div class="pgb${j.wait_left?' wait':''}"><div class=pgf style="width:${j.percent||0}%"></div></div>${j.wait_left?`<div class=pgn>Telegram 限流，${j.wait_left} 秒后自动继续</div>`:''}${(j.errors||[]).map(e=>`<div class=pge>${esc(e)}</div>`).join('')}
  <div class=acts2><span class=sum2>${esc((j.since_bj||'')+' 至 '+(j.until_bj||''))}</span><button class=bt2 onclick="pcancel()">停止</button><button class="bt2 pri" onclick="pullClose()">后台继续</button></div>`;return}
 const last=j&&j.status!='running'?`<div class=pgt>${j.status=='done'?'✅ 上次拉取完成':j.status=='cancelled'?'⏹ 上次拉取已停止':'⚠️ 上次拉取出错'}：拉到 <b>${nf(j.fetched)}</b> 条，新增 <b>${nf(j.added)}</b> 条</div><div class="pgb done"><div class=pgf style="width:${j.status=='done'?100:j.percent||0}%"></div></div>${(j.per_group||[]).length?`<div class=pgr>${j.per_group.map(g=>`${esc(g.title)} +${nf(g.added)}`).join(' · ')}</div>`:''}${(j.truncated||[]).length?`<div class=pgn>这些群消息太多，只拉了最近 2 万条：${j.truncated.map(esc).join('、')}</div>`:''}${(j.errors||[]).map(e=>`<div class=pge>${esc(e)}</div>`).join('')}${sumLine(j)}`:'';
 const ok=PSEL&&PSEL.size&&pmBody();
 f.innerHTML=`${last}<div class=acts2 style="margin-top:${last?10:0}px"><span class=sum2>${esc(pmText())} · ${PSEL?PSEL.size:0} 个群</span><button class=bt2 onclick="pullClose()">关闭</button><button class="bt2 pri" ${ok?'':'disabled'} onclick="pstart(this)">开始拉取</button></div>`}
function sumLine(j){const s=j.summary;if(!s)return '';
 if(s.status=='none')return `<div class=pgr>没有新消息，不需要总结</div>`;
 if(s.status=='pending'&&!s.timeout)return `<div class=pgt style="margin-top:10px">📝 第二步：正在生成总结…</div><div class="pgb ind"><div class=pgf></div></div><div class=pgr>拉取已完成，总结好后时间轴会自动刷新</div>`;
 if(s.status=='done')return `<div class="stp fin">② ✅ AI 总结已生成${s.summary_at?' · '+esc(s.summary_at.slice(5)):''} <button class=bt2 style="padding:3px 12px;font-size:12.5px;margin-left:6px" onclick="pullClose();pjump('${j.id}')">查看总结</button></div>`;
 const why=s.status=='pending'?`总结超时（已等 ${s.waited_min??15} 分钟）`:'总结失败：'+(s.error||'未知原因');
 return `<div class=pge style="margin-top:8px">⚠️ ${esc(why)}</div><div class=pgr2 style="margin-top:6px"><button onclick="sumRetry('${j.id}',this)">重新总结</button></div>`}
async function pstart(b){const body=pmBody();if(!body||!PSEL.size)return;b.disabled=true;body.groups=PGL.filter(g=>PSEL.has(g.key)).map(g=>g.key);
 const r=await fetch('api/tg/pull',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'xbm'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));
 if(r.status==409&&d.error=='busy'){PJ=d.job;pjPoll(d.job.id);return}
 if(r.status==409&&d.error=='not_logged_in'){location.href='tg-login';return}
 if(!r.ok||!d.id){b.disabled=false;return toast('没能开始拉取（'+(d.error||r.status)+'）')}
 PJ=d.job;pfoot();pjPoll(d.id)}
async function pcancel(){if(PJ)await fetch('api/tg/pull/'+PJ.id+'/cancel',{method:'POST',headers:{'X-Requested-With':'xbm'}})}
function pui(){pfoot();const pb=document.querySelector('#list .pullb');if(pb&&view=='tg'){pb.outerHTML=pullBtn()}const bar=document.getElementById('pullbar');if(bar&&view=='tg')bar.innerHTML=pullBar()}
function pjPoll(id){clearInterval(PJT);const tick=async()=>{try{const r=await fetch('api/tg/pull/'+id);if(!r.ok){clearInterval(PJT);PJT=null;return}const d=await r.json();PJ=d.job}catch(e){return}
 pui();if(PJ.status!='running'){clearInterval(PJT);PJT=null;pdone(PJ)}};PJT=setInterval(tick,1000);tick()}
let SPT=null,SPID=null;
function sumPoll(id){clearInterval(SPT);SPID=id;const tick=async()=>{try{const r=await fetch('api/tg/pull/'+id);if(!r.ok){clearInterval(SPT);SPT=null;return}const d=await r.json();const j=d.job;if(!j)return;
  if(!PJ||PJ.id==id)PJ=j;pui();const s=j.summary||{};if(s.status=='pending'&&!s.timeout)return;clearInterval(SPT);SPT=null;
  toast(s.status=='done'?'AI 总结已生成':s.status=='failed'?'总结失败：'+(s.error||'未知原因'):s.status=='pending'?'总结超时，可以点「重新总结」':'');if(view=='tg'){await tg();pui();if(s.status=='done'&&!document.getElementById('ppm'))pjump(id)}}catch(e){}};
 SPT=setInterval(tick,4000);tick()}
function pdone(j){const s=j.summary||{};toast((j.status=='done'?`拉取完成，新增 ${nf(j.added)} 条`:j.status=='cancelled'?`已停止，新增 ${nf(j.added)} 条`:'拉取出错，已保存拉到的部分')+(s.status=='pending'?'，AI 正在总结…':s.status=='none'?'，没有新消息':''));
 if(s.status=='pending'&&!s.timeout)sumPoll(j.id);
 if(view!='tg')return;
 if(GR!='all'&&j.since_bj&&(!GD||GD==T)){const sd=j.since_bj.slice(0,10),need=Math.round((new Date(T+'T12:00:00+08:00')-new Date(sd+'T12:00:00+08:00'))/864e5)+1;
  if(need>+GR){const v=need<=3?'3':need<=7?'7':'all';GR=v;localStorage.gr=v;GP=0}}
 tg().then(()=>{pui();pjump(j.id)})}
async function u(id,b,quiet){const r=await fetch('api/items/'+id,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'xbm'},body:JSON.stringify(b)});
if(!r.ok)return toast('保存失败');toast('已保存');if(!quiet)load()}
function snz(id){const d=prompt('推迟几天？到期后会重新出现在简报里','3');if(d&&+d>0)u(id,{snooze_days:+d})}
function due(id,cur){const d=prompt('截止日期（YYYY-MM-DD，留空清除）',cur);if(d!==null)u(id,{due_date:d.trim()})}
async function hist(id,btn){const r=await fetch('api/items/'+id+'/history');const d=await r.json();btn.closest('.card').querySelector('.hist').innerHTML=d.events.map(e=>esc(e.ts+'  '+e.what)).join('<br>')||'暂无记录'}
// ---------- 🔄 自动刷新（60 秒短轮询，只在内容变化时刷新当前页） ----------
let AV=null,ARF=false,AFR=[],AOBS=[];
const SECV={brief:'brief',bm:'bm',tg:'tg',new:'radar',hot:'radar'};
function hdrH(){const h=document.querySelector('header');return h?h.getBoundingClientRect().bottom:0}
function aBusy(k){const a=document.activeElement;if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return true;
 if(document.getElementById('ppm'))return true;const sl=getSelection&&getSelection();if(sl&&String(sl).trim())return true;
 if(k=='tg'&&(typeof PJT!='undefined'&&PJT||typeof SPT!='undefined'&&SPT))return true;return false}
function brKey(b){if(!b)return '';let d=b.previousElementSibling;while(d&&!d.classList.contains('day'))d=d.previousElementSibling;const t=b.querySelector('.bh b');return (d?d.textContent:'')+'|'+(t?t.textContent:b.id||'')}
function elKey(e){const b=e.closest('.br');
 if(e.classList.contains('card'))return 'c:'+e.dataset.id;
 if(e.classList.contains('br'))return 'b:'+brKey(e);
 if(e.classList.contains('day'))return 'd:'+e.textContent;
 if(e.classList.contains('sp')){const g=e.closest('details.tgg');return 's:'+brKey(b)+'|'+(g?(g.querySelector('.gn')||{}).textContent:'')+'|'+e.textContent}
 if(e.tagName=='TR')return 'r:'+brKey(b)+'|'+e.textContent;return ''}
function aEls(){const L=document.getElementById('list');return [...L.querySelectorAll('.card,.br,.day,.cv:not(.rawm) .sp,table.rt tr')].filter(e=>e.tagName!='TR'||e.querySelector('td'))}
function aMap(){const m=new Map(),n={};for(const e of aEls()){const k=elKey(e);if(!k)continue;n[k]=(n[k]||0)+1;m.set(k+'#'+n[k],e)}return m}
function dKey(d){return brKey(d.closest('.br'))+'|'+d.className+'|'+((d.querySelector(':scope>summary .gn')||d.querySelector(':scope>summary')||{}).textContent||'').replace(/\d[\d,]*/g,'#').slice(0,60)}
function aSnap(){const L=document.getElementById('list');
 return {det:[...L.querySelectorAll('details')].map(d=>[dKey(d),d.open]),
  open:[...L.querySelectorAll('.card.open')].map(e=>e.id),
  hist:[...L.querySelectorAll('.card .hist')].filter(x=>x.innerHTML).map(x=>[x.closest('.card').id,x.innerHTML]),
  note:[...L.querySelectorAll('.card textarea')].filter(t=>t.style.display=='block').map(t=>t.closest('.card').id),
  unc:[...L.querySelectorAll('.br')].filter(b=>b.querySelector('.more')&&!b.querySelector('.cv.clamp')).map(brKey)}}
function aRestore(s){const L=document.getElementById('list');const dm=new Map(s.det);
 L.querySelectorAll('details').forEach(d=>{const k=dKey(d);if(dm.has(k)&&d.open!=dm.get(k))d.open=dm.get(k)});
 s.open.forEach(id=>document.getElementById(id)?.classList.add('open'));
 s.hist.forEach(([id,h])=>{const x=document.getElementById(id)?.querySelector('.hist');if(x)x.innerHTML=h});
 s.note.forEach(id=>{const c=document.getElementById(id);const t=c&&c.querySelector('textarea');if(t){t.style.display='block';const g=c.querySelector('.foot .tg');if(g)g.style.visibility='hidden'}});
 const U=new Set(s.unc);L.querySelectorAll('.br').forEach(b=>{if(U.has(brKey(b))){const c=b.querySelector('.cv.clamp'),m=b.querySelector('.more');if(c){c.classList.remove('clamp');if(m)m.textContent='收起 ▴'}}})}
function aAnchor(){const top=hdrH();const m=[...aMap()];for(const fine of [true,false])for(const [k,e] of m){if(fine!=/^[scr]:/.test(k))continue;const r=e.getBoundingClientRect();if(r.height&&r.bottom>top+2&&r.top<innerHeight)return [k,r.top]}return null}
async function softRefresh(){const s=aSnap(),an=aAnchor(),old=aMap();ARF=true;
 try{await load()}finally{ARF=false}
 aRestore(s);
 if(an){const e=aMap().get(an[0]);if(e){const d=e.getBoundingClientRect().top-an[1];if(Math.abs(d)>0.5)window.scrollBy({top:d,left:0,behavior:'instant'})}}
 const nw=[];for(const [k,e] of aMap())if(!old.has(k))nw.push(e);
 const S=sec();let U=nw.filter(e=>S=='bm'?e.classList.contains('card'):S=='brief'?e.classList.contains('br'):S=='tg'?e.classList.contains('sp')||(e.classList.contains('br')&&!nw.some(x=>x!==e&&e.contains(x))):e.tagName=='TR'||(e.classList.contains('br')&&!nw.some(x=>x!==e&&e.contains(x))));
 U.forEach(e=>e.classList.add('fresh'));
 if(S=='bm'&&io){U.forEach(e=>io.unobserve(e));AOBS=U;setTimeout(()=>addEventListener('scroll',aReobs,{once:true,passive:true}),400)}
 if(U.length){AFR=AFR.filter(e=>e.isConnected).concat(U);aPill()}}
function aReobs(){if(io)AOBS.filter(e=>e.isConnected&&e.dataset.un=='1').forEach(e=>io.observe(e));AOBS=[]}
function aPill(){const p=document.getElementById('npill');AFR=AFR.filter(e=>e.isConnected);if(!AFR.length){p.style.display='none';return}
 p.textContent='有 '+AFR.length+' 条新内容';p.style.top=(hdrH()+8)+'px';p.style.display='block'}
function aJump(){AFR=AFR.filter(e=>e.isConnected);const e=AFR[0];document.getElementById('npill').style.display='none';if(!e)return;
 let d=e.closest('details');while(d){d.open=true;d=d.parentElement&&d.parentElement.closest('details')}
 const c=e.closest('.cv.clamp');if(c){c.classList.remove('clamp');const m=c.parentElement.querySelector('.more');if(m)m.textContent='收起 ▴'}
 window.scrollTo({top:e.getBoundingClientRect().top+scrollY-hdrH()-12,behavior:'smooth'});
 AFR.forEach(x=>{x.classList.remove('fresh');void x.offsetWidth;x.classList.add('fresh')});aReobs();AFR=[]}
async function poll(){if(document.hidden)return;let v;try{const r=await fetch('api/version',{cache:'no-store'});if(r.status==401)return;if(!r.ok)return;v=await r.json()}catch(e){return}
 if(v.ui&&UIV.indexOf('__')<0&&v.ui!=UIV&&!aBusy()&&sessionStorage.uivr!=v.ui){sessionStorage.uivr=v.ui;location.reload();return}
 if(!AV){AV=v;return}const k=SECV[sec()];const nv={...v};
 if(k&&AV[k]!=v[k]){if(aBusy(k)){nv[k]=AV[k]}else{AV=nv;try{await softRefresh()}catch(e){}return}}AV=nv}
setInterval(poll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});poll();
let qt;document.getElementById('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(load,250)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view=='tg')tgStat().then(pui)});
window.onhashchange=()=>{if(location.hash=='#tg-login')return location.replace('tg-login');view=HV(location.hash.slice(1));load()};load();
</script></body></html>
